plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.youtubedownloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.youtubedownloader'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    // Embedded yt-dlp engine. The 0.6.x line is old enough to retain API 19 support.
    implementation 'com.github.yausername.youtubedl-android:library:0.6.+'
}
